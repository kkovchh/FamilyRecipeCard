/* ---------------------------------------------------------------------- */
/*  Shopping List — a running grocery list built by adding recipes' worth  */
/*  of ingredients at a time. Items stay grouped by the recipe they came   */
/*  from, and re-adding a recipe replaces its old items so quantities      */
/*  stay in sync if you edit the recipe later. Shared across the family.   */
/* ---------------------------------------------------------------------- */
function ShoppingListModal({ items, onClose, onToggle, onRemove, onClearChecked, onClearAll, onCopy }) {
  const [copied, setCopied] = useState(false);
  const grouped = [];
  const byRecipe = new Map();
  items.forEach((it) => {
    const key = it.recipeName || "Other";
    if (!byRecipe.has(key)) { byRecipe.set(key, []); grouped.push(key); }
    byRecipe.get(key).push(it);
  });
  const uncheckedCount = items.filter((it) => !it.checked).length;

  const handleCopy = async () => {
    const ok = await onCopy();
    if (ok) { setCopied(true); setTimeout(() => setCopied(false), 1800); }
  };

  return (
    <ModalShell title="Shopping List" onClose={onClose}>
      <div style={{ ...monoFont, fontSize: 12, color: T.inkSoft, marginBottom: 14 }}>
        {items.length === 0 ? "Your list is empty." : `${uncheckedCount} item${uncheckedCount !== 1 ? "s" : ""} left to get`}
      </div>

      {items.length === 0 ? (
        <EmptyState
          icon={<ShoppingCart size={22} color={T.pine} />}
          title="Nothing on the list yet"
          subtitle={'Open a recipe and tap "Add to Shopping List" to start building one.'}
        />
      ) : (
        <>
          <div className="flex flex-col gap-5 mb-5">
            {grouped.map((recipeName) => (
              <div key={recipeName}>
                <Eyebrow style={{ marginBottom: 8 }}>{recipeName}</Eyebrow>
                <div className="flex flex-col gap-1.5">
                  {byRecipe.get(recipeName).map((it) => (
                    <div key={it.id} className="flex items-start gap-2.5">
                      <button
                        onClick={() => onToggle(it.id)}
                        className="flex-shrink-0 flex items-center justify-center"
                        style={{ width: 18, height: 18, marginTop: 2, borderRadius: 5, border: `1.5px solid ${it.checked ? T.pine : T.line}`, background: it.checked ? T.pine : "#fff" }}
                      >
                        {it.checked && <Check size={12} color="#fff" />}
                      </button>
                      <span style={{ ...bodyFont, fontSize: 14.5, color: it.checked ? T.inkFaint : T.ink, textDecoration: it.checked ? "line-through" : "none", flex: 1 }}>
                        {it.text}
                      </span>
                      <button onClick={() => onRemove(it.id)} style={{ color: T.inkFaint, flexShrink: 0, marginTop: 2 }} title="Remove item">
                        <X size={13} />
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>

          <div className="flex gap-2">
            <GhostButton onClick={handleCopy} style={{ flex: 1, justifyContent: "center" }}>
              <Share2 size={13} /> {copied ? "Copied!" : "Copy list"}
            </GhostButton>
            <GhostButton onClick={onClearChecked} style={{ flex: 1, justifyContent: "center" }}>
              Clear checked
            </GhostButton>
          </div>
          <button onClick={onClearAll} className="w-full mt-3 py-1" style={{ ...monoFont, fontSize: 11.5, color: T.brick, textDecoration: "underline" }}>
            Clear entire list
          </button>
        </>
      )}
    </ModalShell>
  );
}

function App() {
  const [loading, setLoading] = useState(true);
  const [members, setMembers] = useState([]);
  const [recipes, setRecipes] = useState([]);
  const [themeName, setThemeName] = useState("classic");
  const [showThemePicker, setShowThemePicker] = useState(false);
  const [shoppingList, setShoppingList] = useState([]);
  const [showShoppingList, setShowShoppingList] = useState(false);
  const [confirmClearShopping, setConfirmClearShopping] = useState(false);

  const [view, setView] = useState({ type: "home" });
  const [activeTab, setActiveTab] = useState("family"); // "family" | "brand"
  const [query, setQuery] = useState("");
  const [filterMember, setFilterMember] = useState("");
  const [filterBrand, setFilterBrand] = useState("");
  const [filterCategory, setFilterCategory] = useState("");
  const [filterFavorites, setFilterFavorites] = useState(false);
  const [viewMode, setViewMode] = useState("grid");

  const [showAddMember, setShowAddMember] = useState(false);
  const [editingMember, setEditingMember] = useState(null);
  const [showAddRecipe, setShowAddRecipe] = useState(false);
  const [editingRecipe, setEditingRecipe] = useState(null);
  const [archiveRecipe, setArchiveRecipe] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [showSurpriseMe, setShowSurpriseMe] = useState(false);
  const [cookModeRecipe, setCookModeRecipe] = useState(null);

  // Applies a theme by name — mutates the shared T object in place (so every
  // component picks up the new colors on its next render) and persists the
  // choice for the whole family to see next time they open the box.
  const applyTheme = useCallback(async (id, { persist = true } = {}) => {
    const theme = THEMES[id] || THEMES.classic;
    Object.assign(T, theme);
    setThemeName(id);
    setShowThemePicker(false);
    if (persist) {
      try { await window.storage.set("app-theme", id, true); } catch (e) { console.error("Failed to save theme", e); }
    }
  }, []);

  /* ---------------------------------------------------------------- */
  /*  Navigation helpers — remember where each recipe/list was opened  */
  /*  from, and remember scroll position per screen so returning to a  */
  /*  list (via Back, or via a recipe's Back button) lands you right   */
  /*  back where you were instead of jumping to the top.               */
  /* ---------------------------------------------------------------- */
  const scrollPositions = useRef({});
  const viewKey = (v) => `${v.type}:${v.id || ""}${v.type === "home" ? ":" + activeTab : ""}`;

  const navigateTo = (newView) => {
    scrollPositions.current[viewKey(view)] = window.scrollY;
    setView(newView);
  };
  // Opens a recipe, remembering the screen it was opened from so the
  // recipe's Back button returns there instead of always going Home.
  const openRecipe = (id) => navigateTo({ type: "recipe", id, from: view });

  useEffect(() => {
    if (loading) return;
    const saved = scrollPositions.current[viewKey(view)];
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        window.scrollTo(0, typeof saved === "number" ? saved : 0);
      });
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [view, loading]);

  useEffect(() => {
    (async () => {
      setLoading(true);
      const [m, r, savedTheme, savedShoppingList] = await Promise.all([
        storageGetAll("member:"),
        storageGetAll("recipe:"),
        window.storage.get("app-theme", true).then((res) => res?.value).catch(() => null),
        window.storage.get("shopping-list", true).then((res) => res?.value).catch(() => null),
      ]);
      setMembers(m.sort((a, b) => (a.dateAdded || "").localeCompare(b.dateAdded || "")));
      // Existing recipes saved before the brand-recipe feature don't have a
      // `source` field — treat those as "family" so nothing already in
      // someone's box quietly disappears or gets miscategorized.
      const normalized = r.map((rec) => ({ ...rec, source: rec.source === "brand" ? "brand" : "family" }));
      setRecipes(normalized.sort((a, b) => (b.dateAdded || "").localeCompare(a.dateAdded || "")));
      if (savedTheme && THEMES[savedTheme]) applyTheme(savedTheme, { persist: false });
      if (savedShoppingList) {
        try { setShoppingList(JSON.parse(savedShoppingList)); } catch (e) { /* corrupt/missing — start empty */ }
      }
      setLoading(false);
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const persistMember = useCallback(async (member) => {
    try { await window.storage.set(`member:${member.id}`, JSON.stringify(member), true); }
    catch (e) { console.error("Failed to save family member", e); }
  }, []);
  const persistRecipe = useCallback(async (recipe) => {
    try { await window.storage.set(`recipe:${recipe.id}`, JSON.stringify(recipe), true); }
    catch (e) { console.error("Failed to save recipe", e); }
  }, []);

  const persistShoppingList = useCallback(async (list) => {
    try { await window.storage.set("shopping-list", JSON.stringify(list), true); }
    catch (e) { console.error("Failed to save shopping list", e); }
  }, []);

  // Adds a recipe's ingredients to the shared shopping list. Re-adding the
  // same recipe replaces its previous items first, so editing a recipe's
  // ingredients and re-adding it keeps the list in sync instead of piling
  // up duplicates.
  const addRecipeToShoppingList = (recipe) => {
    const ingredientLines = (recipe.ingredients || []).filter((ing) => !/^#{1,6}\s*/.test(ing));
    setShoppingList((prev) => {
      const withoutThisRecipe = prev.filter((item) => item.recipeId !== recipe.id);
      const newItems = ingredientLines.map((text) => ({
        id: makeId("shop"),
        text,
        recipeId: recipe.id,
        recipeName: recipe.name,
        checked: false,
      }));
      const next = [...withoutThisRecipe, ...newItems];
      persistShoppingList(next);
      return next;
    });
  };

  const toggleShoppingItem = (id) => {
    setShoppingList((prev) => {
      const next = prev.map((it) => (it.id === id ? { ...it, checked: !it.checked } : it));
      persistShoppingList(next);
      return next;
    });
  };

  const removeShoppingItem = (id) => {
    setShoppingList((prev) => {
      const next = prev.filter((it) => it.id !== id);
      persistShoppingList(next);
      return next;
    });
  };

  const clearCheckedShoppingItems = () => {
    setShoppingList((prev) => {
      const next = prev.filter((it) => !it.checked);
      persistShoppingList(next);
      return next;
    });
  };

  const clearAllShoppingItems = () => {
    setShoppingList([]);
    persistShoppingList([]);
    setConfirmClearShopping(false);
  };

  const copyShoppingListToClipboard = async () => {
    const grouped = new Map();
    shoppingList.forEach((it) => {
      const key = it.recipeName || "Other";
      if (!grouped.has(key)) grouped.set(key, []);
      grouped.get(key).push(it);
    });
    const lines = [];
    for (const [recipeName, its] of grouped) {
      lines.push(recipeName.toUpperCase());
      its.forEach((it) => lines.push(`${it.checked ? "[x]" : "[ ]"} ${it.text}`));
      lines.push("");
    }
    return copyTextToClipboard(lines.join("\n").trim());
  };

  const uncheckedShoppingCount = shoppingList.filter((it) => !it.checked).length;

  const saveMember = async (member) => {
    setMembers((prev) => {
      const exists = prev.some((m) => m.id === member.id);
      return exists ? prev.map((m) => (m.id === member.id ? member : m)) : [...prev, member];
    });
    setShowAddMember(false);
    setEditingMember(null);
    await persistMember(member);
  };

  const saveRecipe = async (recipe) => {
    const prevRecipe = recipes.find((r) => r.id === recipe.id);
    const prevRelated = new Set(prevRecipe?.relatedIds || []);
    const nextRelated = new Set(recipe.relatedIds || []);
    const added = [...nextRelated].filter((id) => !prevRelated.has(id));
    const removed = [...prevRelated].filter((id) => !nextRelated.has(id));

    let updatedOthers = [];
    setRecipes((prev) => {
      const exists = prev.some((r) => r.id === recipe.id);
      let next = exists ? prev.map((r) => (r.id === recipe.id ? recipe : r)) : [recipe, ...prev];
      next = next.map((r) => {
        if (added.includes(r.id)) {
          const ids = new Set(r.relatedIds || []);
          ids.add(recipe.id);
          const updated = { ...r, relatedIds: [...ids] };
          updatedOthers.push(updated);
          return updated;
        }
        if (removed.includes(r.id)) {
          const updated = { ...r, relatedIds: (r.relatedIds || []).filter((id) => id !== recipe.id) };
          updatedOthers.push(updated);
          return updated;
        }
        return r;
      });
      return next;
    });
    setShowAddRecipe(false);
    setEditingRecipe(null);
    await persistRecipe(recipe);
    await Promise.all(updatedOthers.map((r) => persistRecipe(r)));
    if (view.type !== "member" && view.type !== "brand") openRecipe(recipe.id);
  };

  const toggleFavorite = async (id) => {
    const r = recipes.find((x) => x.id === id);
    if (!r) return;
    const updated = { ...r, favorite: !r.favorite };
    setRecipes((prev) => prev.map((x) => (x.id === id ? updated : x)));
    await persistRecipe(updated);
  };

  const deleteRecipeNow = async (id) => {
    const linkedBack = recipes.filter((r) => (r.relatedIds || []).includes(id)).map((r) => ({ ...r, relatedIds: r.relatedIds.filter((rid) => rid !== id) }));
    setRecipes((prev) => prev.filter((r) => r.id !== id).map((r) => linkedBack.find((u) => u.id === r.id) || r));
    try {
      await window.storage.delete(`recipe:${id}`, true);
      await Promise.all(linkedBack.map((r) => persistRecipe(r)));
    } catch (e) { console.error(e); }
    setConfirmDelete(null);
    if (view.type === "recipe" && view.id === id) navigateTo(view.from || { type: "home" });
  };

  const deleteMemberNow = async (id) => {
    const linkedRecipeIds = recipes.filter((r) => r.memberId === id).map((r) => r.id);
    setMembers((prev) => prev.filter((m) => m.id !== id));
    setRecipes((prev) => prev.filter((r) => r.memberId !== id));
    try {
      await window.storage.delete(`member:${id}`, true);
      await Promise.all(linkedRecipeIds.map((rid) => window.storage.delete(`recipe:${rid}`, true).catch(() => {})));
    } catch (e) { console.error(e); }
    setConfirmDelete(null);
    if (view.type === "member" && view.id === id) navigateTo({ type: "home" });
  };

  const memberById = (id) => members.find((m) => m.id === id);
  const familyRecipes = recipes.filter((r) => r.source !== "brand");
  const brandRecipes = recipes.filter((r) => r.source === "brand");
  const categories = Array.from(new Set(familyRecipes.map((r) => r.category).filter(Boolean)));
  const brandCategories = Array.from(new Set(brandRecipes.map((r) => r.category).filter(Boolean)));
  const brandNames = Array.from(new Set(brandRecipes.map((r) => r.brand).filter(Boolean))).sort();

  const q = query.trim().toLowerCase();
  const tabRecipes = activeTab === "brand" ? brandRecipes : familyRecipes;
  const filteredRecipes = tabRecipes.filter((r) => {
    if (activeTab === "family" && filterMember && r.memberId !== filterMember) return false;
    if (activeTab === "brand" && filterBrand && r.brand !== filterBrand) return false;
    if ((activeTab === "family" ? filterCategory : filterCategory) && r.category !== filterCategory) return false;
    if (filterFavorites && !r.favorite) return false;
    if (!q) return true;
    const haystack = [r.name, r.category, r.brand, ...(r.tags || [])].join(" ").toLowerCase();
    return haystack.includes(q);
  });

  const activeRecipe = view.type === "recipe" ? recipes.find((r) => r.id === view.id) : null;
  const activeMember = view.type === "member" ? memberById(view.id) : null;
  const activeBrand = view.type === "brand" ? view.id : null;

  const switchTab = (tab) => {
    scrollPositions.current[viewKey(view)] = window.scrollY;
    setActiveTab(tab);
    setFilterMember("");
    setFilterBrand("");
    setFilterCategory("");
    setFilterFavorites(false);
    setQuery("");
    setView({ type: "home" });
  };

  const Header = (
    <div className="sticky top-0 z-20 no-print" style={{ background: T.paper, borderBottom: `1px solid ${T.lineSoft}` }}>
      <div className="max-w-5xl mx-auto px-4 pt-5 pb-3" style={{ position: "relative" }}>
        <button className="flex items-center gap-2 mb-4" onClick={() => navigateTo({ type: "home" })}>
          <div className="w-9 h-9 rounded-full flex items-center justify-center" style={{ background: T.pine }}>
            <BookOpen size={16} color="#fff" />
          </div>
          <div style={{ ...displayFont, fontWeight: 700, fontSize: 21, color: T.ink }}>The Family Recipe Box</div>
        </button>
        <div style={{ position: "absolute", right: 16, top: 20, display: "flex", alignItems: "center", gap: 14 }}>
          <button
            onClick={() => setShowShoppingList(true)}
            title="Shopping list"
            className="flex items-center"
            style={{ position: "relative", color: T.pine }}
          >
            <ShoppingCart size={16} />
            {uncheckedShoppingCount > 0 && (
              <span
                style={{
                  position: "absolute", top: -7, right: -8, minWidth: 15, height: 15, padding: "0 3px",
                  borderRadius: 999, background: T.brick, color: "#fff", ...monoFont, fontSize: 9.5,
                  display: "flex", alignItems: "center", justifyContent: "center",
                }}
              >
                {uncheckedShoppingCount}
              </span>
            )}
          </button>
          <button
            onClick={() => setShowThemePicker(true)}
            title="Change theme"
            className="flex items-center gap-1.5"
            style={{ ...monoFont, fontSize: 11.5, color: T.pine }}
          >
            <Palette size={14} /> {THEMES[themeName].emoji}
          </button>
          <button
            onClick={() => supabaseClient.auth.signOut()}
            style={{ ...monoFont, fontSize: 11.5, color: T.inkSoft, textDecoration: "underline" }}
          >
            Sign out
          </button>
        </div>

        <div className="flex gap-2 mb-3">
          <button
            onClick={() => switchTab("family")}
            className="flex items-center gap-1.5 px-4 py-2 rounded-full transition-colors"
            style={{
              ...monoFont, fontSize: 12.5,
              background: activeTab === "family" ? T.pine : "#fff",
              color: activeTab === "family" ? "#fff" : T.inkSoft,
              border: `1px solid ${activeTab === "family" ? T.pine : T.line}`,
            }}
          >
            <Users size={13} /> Family Recipes
          </button>
          <button
            onClick={() => switchTab("brand")}
            className="flex items-center gap-1.5 px-4 py-2 rounded-full transition-colors"
            style={{
              ...monoFont, fontSize: 12.5,
              background: activeTab === "brand" ? T.pine : "#fff",
              color: activeTab === "brand" ? "#fff" : T.inkSoft,
              border: `1px solid ${activeTab === "brand" ? T.pine : T.line}`,
            }}
          >
            <Tag size={13} /> Brand Recipes
          </button>
        </div>

        <div className="relative">
          <div style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", pointerEvents: "none" }}>
            <Search size={16} color={T.inkFaint} />
          </div>
          <input
            value={query}
            onChange={(e) => { setQuery(e.target.value); if (view.type !== "home") navigateTo({ type: "home" }); }}
            placeholder={activeTab === "brand" ? "Search brand recipes by name, brand, or tag…" : "Search by recipe name, category, or tag…"}
            style={{ ...bodyFont, width: "100%", padding: "11px 14px 11px 40px", borderRadius: 999, border: `1px solid ${T.line}`, background: "#fff", fontSize: 14.5, outline: "none" }}
          />
          {query && (
            <button onClick={() => setQuery("")} style={{ position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)" }}>
              <X size={15} color={T.inkFaint} />
            </button>
          )}
        </div>
        {activeTab === "family" && (
          <div className="flex gap-2 mt-3">
            <button
              onClick={() => setShowSurpriseMe(true)}
              className="flex items-center gap-1.5 px-3 py-1.5 rounded-full"
              style={{ background: "#fff", border: `1px solid ${T.line}`, ...monoFont, fontSize: 11.5, color: T.pine }}
            >
              <Dice size={13} /> Surprise Me
            </button>
            <button
              onClick={() => navigateTo({ type: "cookbook" })}
              className="flex items-center gap-1.5 px-3 py-1.5 rounded-full"
              style={{ background: "#fff", border: `1px solid ${T.line}`, ...monoFont, fontSize: 11.5, color: T.pine }}
            >
              <Printer size={13} /> Export All Recipes
            </button>
          </div>
        )}
      </div>
    </div>
  );

  const FamilyHome = (
    <div className="max-w-5xl mx-auto px-4 pb-24">
      {!q && (
        <>
          <div className="flex items-center justify-between mt-6 mb-3">
            <div style={{ ...displayFont, fontWeight: 600, fontSize: 18, color: T.ink }}>Browse by Family Member</div>
            <GhostButton onClick={() => setShowAddMember(true)}><Plus size={13} /> Add family member</GhostButton>
          </div>

          {members.length === 0 ? (
            <div className="rounded-2xl mb-6" style={{ background: T.card, border: `1px dashed ${T.line}` }}>
              <EmptyState icon={<Users size={22} color={T.pine} />} title="No family members yet" subtitle="Add grandma, mom, or anyone whose recipes you want to preserve." />
            </div>
          ) : (
            <div className="flex gap-4 overflow-x-auto pb-3 mb-6 -mx-1 px-1">
              {members.map((m) => {
                const count = familyRecipes.filter((r) => r.memberId === m.id).length;
                return (
                  <button key={m.id} onClick={() => navigateTo({ type: "member", id: m.id })} className="flex flex-col items-center flex-shrink-0 w-24">
                    <div className="w-20 h-20 rounded-full overflow-hidden mb-2" style={{ background: T.paperTexture, border: `2px solid #fff`, boxShadow: "0 3px 10px rgba(43,36,24,0.15)" }}>
                      {m.photo ? <img src={m.photo} alt="" className="w-full h-full object-cover" /> : (
                        <div className="w-full h-full flex items-center justify-center"><Users size={18} color={T.inkFaint} /></div>
                      )}
                    </div>
                    <div style={{ ...displayFont, fontWeight: 600, fontSize: 12.5, color: T.ink, textAlign: "center" }} className="truncate w-full">{m.name}</div>
                    <div style={{ ...monoFont, fontSize: 10, color: T.inkSoft }}>{count} recipe{count !== 1 ? "s" : ""}</div>
                  </button>
                );
              })}
            </div>
          )}
        </>
      )}

      <div className="flex items-center gap-2 overflow-x-auto pb-1 mb-2">
        <Chip active={!filterMember && !filterCategory && !filterFavorites} onClick={() => { setFilterMember(""); setFilterCategory(""); setFilterFavorites(false); }}>All</Chip>
        {categories.map((c) => (
          <Chip key={c} active={filterCategory === c} onClick={() => setFilterCategory(filterCategory === c ? "" : c)}>{c}</Chip>
        ))}
        <Chip active={filterFavorites} onClick={() => setFilterFavorites((v) => !v)} color={T.brick}>♥ Favorites</Chip>
      </div>

      {members.length > 0 && (
        <div className="mb-4">
          <select value={filterMember} onChange={(e) => setFilterMember(e.target.value)} style={{ ...monoFont, fontSize: 12, color: T.inkSoft, padding: "6px 10px", borderRadius: 8, border: `1px solid ${T.line}`, background: "#fff" }}>
            <option value="">Filter by family member…</option>
            {members.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
          </select>
        </div>
      )}

      <div className="flex items-center justify-between mb-3">
        <div style={{ ...displayFont, fontWeight: 600, fontSize: 18, color: T.ink }}>
          {q ? `Search results for “${query}”` : "Recipe Library"}
        </div>
        <div className="flex items-center gap-2">
          <button onClick={() => setViewMode("grid")} className="w-8 h-8 rounded-full flex items-center justify-center" style={{ background: viewMode === "grid" ? T.pine : "transparent", color: viewMode === "grid" ? "#fff" : T.inkSoft }}>
            <LayoutGrid size={14} />
          </button>
          <button onClick={() => setViewMode("list")} className="w-8 h-8 rounded-full flex items-center justify-center" style={{ background: viewMode === "list" ? T.pine : "transparent", color: viewMode === "list" ? "#fff" : T.inkSoft }}>
            <ListIcon size={14} />
          </button>
          <PrimaryButton onClick={() => setShowAddRecipe(true)} style={{ padding: "8px 16px", fontSize: 13 }}>
            <Plus size={14} /> Add recipe
          </PrimaryButton>
        </div>
      </div>

      {filteredRecipes.length === 0 ? (
        <EmptyState
          icon={<Search size={20} color={T.pine} />}
          title={familyRecipes.length === 0 ? "Your recipe box is empty" : "No recipes match"}
          subtitle={familyRecipes.length === 0 ? "Add your first recipe to start building the family archive." : "Try a different search term or clear your filters."}
        />
      ) : viewMode === "grid" ? (
        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
          {filteredRecipes.map((r) => (
            <RecipeCard key={r.id} recipe={r} member={memberById(r.memberId)} onOpen={openRecipe} onToggleFavorite={toggleFavorite} onOpenArchive={setArchiveRecipe} viewMode="grid" />
          ))}
        </div>
      ) : (
        <div className="flex flex-col gap-2.5">
          {filteredRecipes.map((r) => (
            <RecipeCard key={r.id} recipe={r} member={memberById(r.memberId)} onOpen={openRecipe} onToggleFavorite={toggleFavorite} onOpenArchive={setArchiveRecipe} viewMode="list" />
          ))}
        </div>
      )}
    </div>
  );

  const BrandHome = (
    <div className="max-w-5xl mx-auto px-4 pb-24">
      {!q && (
        <>
          <div className="flex items-center justify-between mt-6 mb-3">
            <div style={{ ...displayFont, fontWeight: 600, fontSize: 18, color: T.ink }}>Browse by Brand</div>
          </div>

          {brandNames.length === 0 ? (
            <div className="rounded-2xl mb-6" style={{ background: T.card, border: `1px dashed ${T.line}` }}>
              <EmptyState icon={<Tag size={22} color={T.pine} />} title="No brand recipes yet" subtitle="Add recipes you've collected from stores, cereal boxes, or company websites — kept separate from the family recipes." />
            </div>
          ) : (
            <div className="flex gap-4 overflow-x-auto pb-3 mb-6 -mx-1 px-1">
              {brandNames.map((b) => {
                const count = brandRecipes.filter((r) => r.brand === b).length;
                return (
                  <button key={b} onClick={() => navigateTo({ type: "brand", id: b })} className="flex flex-col items-center flex-shrink-0 w-24">
                    <div className="w-20 h-20 rounded-full overflow-hidden mb-2 flex items-center justify-center" style={{ background: T.paperTexture, border: `2px solid #fff`, boxShadow: "0 3px 10px rgba(43,36,24,0.15)" }}>
                      <Tag size={18} color={T.inkFaint} />
                    </div>
                    <div style={{ ...displayFont, fontWeight: 600, fontSize: 12.5, color: T.ink, textAlign: "center" }} className="truncate w-full">{b}</div>
                    <div style={{ ...monoFont, fontSize: 10, color: T.inkSoft }}>{count} recipe{count !== 1 ? "s" : ""}</div>
                  </button>
                );
              })}
            </div>
          )}
        </>
      )}

      <div className="flex items-center gap-2 overflow-x-auto pb-1 mb-2">
        <Chip active={!filterBrand && !filterCategory && !filterFavorites} onClick={() => { setFilterBrand(""); setFilterCategory(""); setFilterFavorites(false); }}>All</Chip>
        {brandCategories.map((c) => (
          <Chip key={c} active={filterCategory === c} onClick={() => setFilterCategory(filterCategory === c ? "" : c)}>{c}</Chip>
        ))}
        <Chip active={filterFavorites} onClick={() => setFilterFavorites((v) => !v)} color={T.brick}>♥ Favorites</Chip>
      </div>

      {brandNames.length > 0 && (
        <div className="mb-4">
          <select value={filterBrand} onChange={(e) => setFilterBrand(e.target.value)} style={{ ...monoFont, fontSize: 12, color: T.inkSoft, padding: "6px 10px", borderRadius: 8, border: `1px solid ${T.line}`, background: "#fff" }}>
            <option value="">Filter by brand…</option>
            {brandNames.map((b) => <option key={b} value={b}>{b}</option>)}
          </select>
        </div>
      )}

      <div className="flex items-center justify-between mb-3">
        <div style={{ ...displayFont, fontWeight: 600, fontSize: 18, color: T.ink }}>
          {q ? `Search results for “${query}”` : "Brand Recipe Library"}
        </div>
        <div className="flex items-center gap-2">
          <button onClick={() => setViewMode("grid")} className="w-8 h-8 rounded-full flex items-center justify-center" style={{ background: viewMode === "grid" ? T.pine : "transparent", color: viewMode === "grid" ? "#fff" : T.inkSoft }}>
            <LayoutGrid size={14} />
          </button>
          <button onClick={() => setViewMode("list")} className="w-8 h-8 rounded-full flex items-center justify-center" style={{ background: viewMode === "list" ? T.pine : "transparent", color: viewMode === "list" ? "#fff" : T.inkSoft }}>
            <ListIcon size={14} />
          </button>
          <PrimaryButton onClick={() => setShowAddRecipe(true)} style={{ padding: "8px 16px", fontSize: 13 }}>
            <Plus size={14} /> Add recipe
          </PrimaryButton>
        </div>
      </div>

      {filteredRecipes.length === 0 ? (
        <EmptyState
          icon={<Search size={20} color={T.pine} />}
          title={brandRecipes.length === 0 ? "No brand recipes yet" : "No recipes match"}
          subtitle={brandRecipes.length === 0 ? "Add the first recipe you've collected from a brand or store." : "Try a different search term or clear your filters."}
        />
      ) : viewMode === "grid" ? (
        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
          {filteredRecipes.map((r) => (
            <RecipeCard key={r.id} recipe={r} member={null} onOpen={openRecipe} onToggleFavorite={toggleFavorite} onOpenArchive={setArchiveRecipe} viewMode="grid" />
          ))}
        </div>
      ) : (
        <div className="flex flex-col gap-2.5">
          {filteredRecipes.map((r) => (
            <RecipeCard key={r.id} recipe={r} member={null} onOpen={openRecipe} onToggleFavorite={toggleFavorite} onOpenArchive={setArchiveRecipe} viewMode="list" />
          ))}
        </div>
      )}
    </div>
  );

  return (
    <div className="min-h-screen w-full" style={{ background: T.paper, backgroundImage: `repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(201,186,149,0.35) 28px)`, ...bodyFont }}>
      {Header}

      {loading ? (
        <div className="max-w-5xl mx-auto px-4 py-24 text-center" style={{ ...monoFont, color: T.inkSoft, fontSize: 13 }}>Opening the recipe box…</div>
      ) : view.type === "recipe" && activeRecipe ? (
        <RecipeDetail
          recipe={activeRecipe}
          member={memberById(activeRecipe.memberId)}
          allRecipes={recipes}
          onBack={() => navigateTo(view.from || { type: "home" })}
          onEdit={(r) => setEditingRecipe(r)}
          onDelete={(id) => setConfirmDelete({ kind: "recipe", id, text: `Delete “${activeRecipe.name}”? This can't be undone.` })}
          onToggleFavorite={toggleFavorite}
          onOpenArchive={setArchiveRecipe}
          onOpenMember={(id) => navigateTo({ type: "member", id })}
          onOpenRecipe={openRecipe}
          onCookMode={setCookModeRecipe}
          onAddToShoppingList={addRecipeToShoppingList}
        />
      ) : view.type === "cookbook" ? (
        <CookbookExport recipes={familyRecipes} members={members} onBack={() => navigateTo({ type: "home" })} />
      ) : view.type === "member" && activeMember ? (
        <MemberDetail
          member={activeMember}
          recipes={familyRecipes.filter((r) => r.memberId === activeMember.id)}
          onBack={() => navigateTo({ type: "home" })}
          onEdit={(m) => setEditingMember(m)}
          onDelete={(id) => setConfirmDelete({ kind: "member", id, text: `Delete ${activeMember.name} and all ${familyRecipes.filter((r) => r.memberId === id).length} of their recipes? This can't be undone.` })}
          onOpenRecipe={openRecipe}
          onToggleFavorite={toggleFavorite}
          onOpenArchive={setArchiveRecipe}
          onAddRecipe={() => setShowAddRecipe(true)}
        />
      ) : view.type === "brand" && activeBrand ? (
        <BrandDetail
          brand={activeBrand}
          recipes={brandRecipes.filter((r) => r.brand === activeBrand)}
          onBack={() => navigateTo({ type: "home" })}
          onOpenRecipe={openRecipe}
          onToggleFavorite={toggleFavorite}
          onOpenArchive={setArchiveRecipe}
          onAddRecipe={() => setShowAddRecipe(true)}
        />
      ) : activeTab === "brand" ? (
        BrandHome
      ) : (
        FamilyHome
      )}

      {showAddMember && <MemberFormModal onClose={() => setShowAddMember(false)} onSave={saveMember} />}
      {editingMember && <MemberFormModal initial={editingMember} onClose={() => setEditingMember(null)} onSave={saveMember} />}

      {showAddRecipe && (
        <RecipeFormModal
          members={members}
          categories={activeTab === "brand" ? brandCategories : categories}
          recipes={recipes}
          defaultMemberId={view.type === "member" ? view.id : ""}
          source={activeTab === "brand" ? "brand" : "family"}
          brands={brandNames}
          defaultBrand={view.type === "brand" ? view.id : ""}
          onClose={() => setShowAddRecipe(false)}
          onSave={saveRecipe}
        />
      )}
      {editingRecipe && (
        <RecipeFormModal initial={editingRecipe} members={members} categories={categories} recipes={recipes} brands={brandNames} onClose={() => setEditingRecipe(null)} onSave={saveRecipe} />
      )}

      {archiveRecipe && <ArchiveLightbox recipe={archiveRecipe} onClose={() => setArchiveRecipe(null)} />}

      {cookModeRecipe && <CookMode recipe={cookModeRecipe} onClose={() => setCookModeRecipe(null)} />}

      {showSurpriseMe && (
        <SurpriseMeModal
          recipes={familyRecipes}
          members={members}
          onClose={() => setShowSurpriseMe(false)}
          onPick={(id) => { setShowSurpriseMe(false); openRecipe(id); }}
        />
      )}

      {showThemePicker && (
        <ThemePicker themeName={themeName} onPick={applyTheme} onClose={() => setShowThemePicker(false)} />
      )}

      {showShoppingList && (
        <ShoppingListModal
          items={shoppingList}
          onClose={() => setShowShoppingList(false)}
          onToggle={toggleShoppingItem}
          onRemove={removeShoppingItem}
          onClearChecked={clearCheckedShoppingItems}
          onClearAll={() => setConfirmClearShopping(true)}
          onCopy={copyShoppingListToClipboard}
        />
      )}

      {confirmClearShopping && (
        <ConfirmDialog
          text="Clear the entire shopping list? This can't be undone."
          onCancel={() => setConfirmClearShopping(false)}
          onConfirm={clearAllShoppingItems}
        />
      )}

      {confirmDelete && (
        <ConfirmDialog
          text={confirmDelete.text}
          onCancel={() => setConfirmDelete(null)}
          onConfirm={() => (confirmDelete.kind === "recipe" ? deleteRecipeNow(confirmDelete.id) : deleteMemberNow(confirmDelete.id))}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AuthGate>{() => <App />}</AuthGate>);
</script>
</body>
</html>

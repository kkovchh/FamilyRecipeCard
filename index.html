/* ---------------------------------------------------------------------- */
/*  window.storage shim                                                    */
/*  This file is a standalone HTML page, so it doesn't automatically have  */
/*  access to Claude's artifact `window.storage` API. This shim provides   */
/*  the same get/set/delete/list interface backed by localStorage, so the  */
/*  recipe box persists data when opened directly in a browser. If a real  */
/*  window.storage is already present (e.g. running inside a Claude        */
/*  artifact), it's left untouched and used instead.                       */
/* ---------------------------------------------------------------------- */
/* ---------------------------------------------------------------------- */
/*  Supabase-backed window.storage                                         */
/*  Data now lives in a shared cloud database instead of the browser's     */
/*  local storage, so every family member who logs in sees the same       */
/*  recipes on every device.                                               */
/* ---------------------------------------------------------------------- */
const SUPABASE_URL = "https://aivjtidstcapgzwyjcke.supabase.co";
const SUPABASE_KEY = "sb_publishable_2ZhY_DuziybK47Wrp2kyTA__B8z-Rrj";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

window.storage = {
  async get(key, shared = true) {
    const { data, error } = await supabaseClient.from("kv_store").select("value").eq("key", key).eq("shared", shared).maybeSingle();
    if (error) throw error;
    if (!data) throw new Error(`Key not found: ${key}`);
    return { key, value: data.value, shared: !!shared };
  },
  async set(key, value, shared = true) {
    const { data: userData } = await supabaseClient.auth.getUser();
    const { error } = await supabaseClient
      .from("kv_store")
      .upsert({ key, value, shared, owner: userData?.user?.id, updated_at: new Date().toISOString() }, { onConflict: "key,shared" });
    if (error) throw error;
    return { key, value, shared: !!shared };
  },
  async delete(key, shared = true) {
    const { error } = await supabaseClient.from("kv_store").delete().eq("key", key).eq("shared", shared);
    if (error) throw error;
    return { key, deleted: true, shared: !!shared };
  },
  async list(prefix = "", shared = true) {
    const { data, error } = await supabaseClient.from("kv_store").select("key").eq("shared", shared).like("key", `${prefix}%`);
    if (error) throw error;
    return { keys: (data || []).map((r) => r.key), prefix, shared: !!shared };
  },
};

function makeId(prefix) {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
}

function hashRotation(id, spread = 2.4) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return ((h % 1000) / 1000 - 0.5) * spread * 2;
}

const FRACTION_MAP = {
  "1/2": "½", "1/3": "⅓", "2/3": "⅔", "1/4": "¼", "3/4": "¾",
  "1/5": "⅕", "2/5": "⅖", "3/5": "⅗", "4/5": "⅘",
  "1/6": "⅙", "5/6": "⅚", "1/7": "⅐", "1/8": "⅛", "3/8": "⅜",
  "5/8": "⅝", "7/8": "⅞", "1/9": "⅑", "1/10": "⅒",
};

// Converts plain-text fractions like "1/2" or "1 1/2" into unicode
// fraction characters ("½" / "1½"). Only replaces fractions that fall
// on a word boundary (not part of a date or larger number) so things
// like "1/2 cup" become "½ cup" and "3 1/4 cups" become "3¼ cups".
function formatFractions(str) {
  if (!str) return str;
  return str.replace(/(\d+)\s+(\d{1,2}\/\d{1,2})\b/g, (m, whole, frac) => {
    const symbol = FRACTION_MAP[frac];
    return symbol ? `${whole}${symbol}` : m;
  }).replace(/\b(\d{1,2}\/\d{1,2})\b/g, (m, frac) => FRACTION_MAP[frac] || m);
}

function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

function triggerPrint() {
  const originalTitle = document.title;
  document.title = " ";
  const restore = () => {
    document.title = originalTitle;
    window.removeEventListener("afterprint", restore);
  };
  window.addEventListener("afterprint", restore);
  // Fallback in case afterprint doesn't fire (some older/mobile browsers)
  setTimeout(restore, 3000);
  window.print();
}

function recipeToText(recipe, member) {
  const lines = [];
  lines.push(recipe.name);
  const sub = [member ? `from ${member.name}'s recipe box` : null, recipe.category || null].filter(Boolean).join(" · ");
  if (sub) lines.push(sub);
  lines.push("");
  if (recipe.ingredients?.length) {
    lines.push("INGREDIENTS");
    recipe.ingredients.forEach((ing) => {
      const heading = ing.match(/^#{1,6}\s*(.+)/);
      lines.push(heading ? `\n${heading[1].toUpperCase()}` : `- ${ing}`);
    });
    lines.push("");
  }
  if (recipe.directions?.length) {
    lines.push("DIRECTIONS");
    let stepNum = 0;
    recipe.directions.forEach((step) => {
      const heading = step.match(/^#{1,6}\s*(.+)/);
      if (heading) { lines.push(`\n${heading[1].toUpperCase()}`); return; }
      stepNum += 1;
      lines.push(`${stepNum}. ${step}`);
    });
    lines.push("");
  }
  if (recipe.notes) {
    lines.push("FAMILY MEMORY / STORY");
    lines.push(recipe.notes);
  }
  return lines.join("\n").trim();
}

/*  Cook Mode helpers                                                      */
/* ---------------------------------------------------------------------- */
// Turns the flat directions array into a list of { heading, text } steps,
// skipping "#" heading lines but carrying the most recent one along as
// context for the steps that follow it (e.g. "FILLING" / "CRUST").
function buildCookSteps(directions) {
  const steps = [];
  let currentHeading = null;
  (directions || []).forEach((line) => {
    const headingMatch = line.match(/^#{1,6}\s*(.+)/);
    if (headingMatch) {
      currentHeading = headingMatch[1];
    } else if (line.trim()) {
      steps.push({ heading: currentHeading, text: line });
    }
  });
  return steps;
}

// Looks for a duration mentioned in a step ("bake for 25 minutes", "simmer
// 1/2 hour", "cook 5-10 minutes") and returns it in seconds, using the
// upper bound of a range. Returns null if no duration is found.
function parseStepTimer(text) {
  if (!text) return null;
  const match = text.match(/(\d+)\s*(?:[-–to]+\s*(\d+))?\s*(hour|hr|minute|min|second|sec)s?\b/i);
  if (!match) return null;
  const value = parseInt(match[2] || match[1], 10);
  if (!value) return null;
  const unit = match[3].toLowerCase();
  if (unit.startsWith("h")) return value * 3600;
  if (unit.startsWith("m")) return value * 60;
  return value;
}

function formatTimer(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
  return `${m}:${String(sec).padStart(2, "0")}`;
}

// Alert used when a Cook Mode timer finishes: a Web Audio beep pattern plus
// a vibration fallback (phones only) so the alert still lands even in an
// environment that's blocking audio (e.g. device on silent/mute).
function playTimerAlert(ctx) {
  try {
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
  } catch (e) { /* vibration unavailable — ignore */ }
  try {
    if (!ctx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      ctx = new Ctx();
    }
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    [0, 0.3, 0.6, 0.9].forEach((delay) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "square";
      osc.frequency.value = 988;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const start = ctx.currentTime + delay;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.5, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.24);
      osc.start(start);
      osc.stop(start + 0.26);
    });
  } catch (e) { /* Web Audio unavailable — vibration (if any) still fired above */ }
}

// A tiny, near-instant click sound played the moment "Start timer" is
// tapped — purely so there's immediate audible proof the audio pipeline is
// working, since the real alarm won't fire until later (when it's harder
// to tell whether silence means "not done yet" or "sound is blocked").
function playUnlockTick(ctx) {
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = 660;
    osc.connect(gain);
    gain.connect(ctx.destination);
    const start = ctx.currentTime;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.3, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.12);
    osc.start(start);
    osc.stop(start + 0.14);
  } catch (e) { /* ignore */ }
}

async function copyTextToClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fall through to legacy approach */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

function compressImageFile(file, maxDim = 1100, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; }
          else { width = Math.round((width * maxDim) / height); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => reject(new Error("Could not read image"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("Could not read file"));
    reader.readAsDataURL(file);
  });
}

async function storageGetAll(prefix) {
  const out = [];
  try {
    const listed = await window.storage.list(prefix, true);
    if (listed && listed.keys) {
      for (const k of listed.keys) {
        try {
          const r = await window.storage.get(k, true);
          if (r && r.value) out.push(JSON.parse(r.value));
        } catch (e) { /* skip unreadable entry */ }
      }
    }
  } catch (e) {
    console.error("storage list failed", e);
  }
  return out;
}

/* ---------------------------------------------------------------------- */
/*  Cook Mode — a full-screen, hands-free, step-by-step walkthrough with   */
/*  large text, one step at a time, built-in timers for steps that         */
/*  mention a duration, and a screen wake lock so the phone doesn't sleep  */
/*  mid-recipe. Ingredients stay one tap away without leaving the flow.    */
/* ---------------------------------------------------------------------- */
function CookMode({ recipe, onClose }) {
  const cookSteps = React.useMemo(() => buildCookSteps(recipe.directions), [recipe]);
  const [stepIdx, setStepIdx] = useState(0);
  const [showIngredients, setShowIngredients] = useState(false);
  const [checkedIngredients, setCheckedIngredients] = useState(() => new Set());
  const [timerSeconds, setTimerSeconds] = useState(null);
  const [timerRunning, setTimerRunning] = useState(false);
  const wakeLockRef = useRef(null);
  const intervalRef = useRef(null);
  const audioCtxRef = useRef(null);

  // Created lazily, and only ever from inside a real tap handler (Start /
  // Resume) — that's what lets the browser actually let sound play later
  // when the timer hits zero, instead of silently blocking it.
  const unlockAudio = () => {
    try {
      if (!audioCtxRef.current) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtxRef.current = new Ctx();
      }
      if (audioCtxRef.current.state === "suspended") audioCtxRef.current.resume().catch(() => {});
    } catch (e) { /* Web Audio unavailable — timer still works, just silently */ }
  };

  const toggleIngredientChecked = (i) => {
    setCheckedIngredients((prev) => {
      const next = new Set(prev);
      if (next.has(i)) next.delete(i);
      else next.add(i);
      return next;
    });
  };

  const step = cookSteps[stepIdx] || null;
  const suggestedSeconds = step ? parseStepTimer(step.text) : null;

  // Keep the screen awake for the duration of Cook Mode, where supported.
  useEffect(() => {
    let cancelled = false;
    const requestLock = async () => {
      try {
        if ("wakeLock" in navigator) {
          const lock = await navigator.wakeLock.request("screen");
          if (!cancelled) wakeLockRef.current = lock;
          else lock.release().catch(() => {});
        }
      } catch (e) { /* not supported, or permission denied — Cook Mode still works fine */ }
    };
    requestLock();
    const handleVisibility = () => {
      if (document.visibilityState === "visible" && !wakeLockRef.current) requestLock();
    };
    document.addEventListener("visibilitychange", handleVisibility);
    return () => {
      cancelled = true;
      document.removeEventListener("visibilitychange", handleVisibility);
      if (wakeLockRef.current) {
        wakeLockRef.current.release().catch(() => {});
        wakeLockRef.current = null;
      }
      if (audioCtxRef.current) {
        audioCtxRef.current.close().catch(() => {});
        audioCtxRef.current = null;
      }
    };
  }, []);

  // Reset any running timer whenever the step changes.
  useEffect(() => {
    setTimerRunning(false);
    setTimerSeconds(null);
    if (intervalRef.current) clearInterval(intervalRef.current);
  }, [stepIdx]);

  useEffect(() => {
    if (!timerRunning) return;
    intervalRef.current = setInterval(() => {
      setTimerSeconds((s) => {
        if (s === null) return s;
        if (s <= 1) {
          clearInterval(intervalRef.current);
          setTimerRunning(false);
          playTimerAlert(audioCtxRef.current);
          return 0;
        }
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, [timerRunning]);

  const startTimer = (seconds) => {
    unlockAudio();
    setTimerSeconds(seconds);
    setTimerRunning(true);
  };
  const resetTimer = () => {
    setTimerRunning(false);
    setTimerSeconds(null);
  };

  const goNext = () => setStepIdx((i) => Math.min(i + 1, cookSteps.length - 1));
  const goPrev = () => setStepIdx((i) => Math.max(i - 1, 0));
  const isLast = stepIdx === cookSteps.length - 1;
  const progress = cookSteps.length ? ((stepIdx + 1) / cookSteps.length) * 100 : 0;

  if (cookSteps.length === 0) {
    return (
      <div className="fixed inset-0 z-50 flex flex-col items-center justify-center text-center no-print px-6" style={{ background: T.paper }}>
        <div style={{ ...bodyFont, fontSize: 15, color: T.inkSoft, marginBottom: 20, maxWidth: 320 }}>This recipe doesn't have any directions to walk through yet.</div>
        <GhostButton onClick={onClose}>Close</GhostButton>
      </div>
    );
  }

  return (
    <div className="fixed inset-0 z-50 flex flex-col no-print" style={{ background: T.paper }}>
      <div style={{ height: 4, background: T.lineSoft, flexShrink: 0 }}>
        <div style={{ height: "100%", width: `${progress}%`, background: T.pine, transition: "width 0.25s ease" }} />
      </div>

      <div className="flex items-center justify-between px-5 py-4 flex-shrink-0" style={{ borderBottom: `1px solid ${T.lineSoft}` }}>
        <div style={{ ...monoFont, color: T.inkSoft, fontSize: 12 }}>
          Step {stepIdx + 1} of {cookSteps.length}
        </div>
        <div className="flex items-center gap-2">
          <button
            onClick={() => setShowIngredients(true)}
            className="cook-ingredients-toggle-btn"
            style={{ ...monoFont, fontSize: 11.5, color: T.pine, border: `1px solid ${T.line}`, borderRadius: 999, padding: "7px 14px", background: "#fff" }}
          >
            Ingredients
          </button>
          <IconButton onClick={onClose} title="Exit Cook Mode"><X size={18} /></IconButton>
        </div>
      </div>

      <div className="flex-1 flex" style={{ minHeight: 0 }}>
        <div className="flex-1 flex items-stretch" style={{ minHeight: 0 }}>
        <button onClick={goPrev} disabled={stepIdx === 0} className="flex items-center justify-center flex-shrink-0" style={{ width: "15%", opacity: stepIdx === 0 ? 0.25 : 1, color: T.inkSoft }}>
          <ChevronLeft size={26} />
        </button>
        <div className="flex-1 flex flex-col items-center justify-center px-5 text-center" style={{ overflowY: "auto" }}>
          {step.heading && (
            <div style={{ ...monoFont, fontSize: 12, color: T.pine, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 16 }}>{step.heading}</div>
          )}
          <div style={{ ...displayFont, fontWeight: 600, fontSize: "clamp(22px, 5vw, 34px)", color: T.ink, lineHeight: 1.35, maxWidth: 620 }}>
            {step.text}
          </div>

          {suggestedSeconds != null && (
            <div className="mt-8 flex flex-col items-center gap-3">
              {timerSeconds === null ? (
                <button
                  onClick={() => startTimer(suggestedSeconds)}
                  className="flex items-center gap-2 px-5 py-2.5 rounded-full shadow-sm"
                  style={{ background: T.pine, color: "#fff", ...displayFont, fontWeight: 600, fontSize: 14 }}
                >
                  <Play size={14} /> Start {formatTimer(suggestedSeconds)} timer
                </button>
              ) : (
                <div className="flex flex-col items-center gap-3">
                  <div style={{ ...displayFont, fontWeight: 700, fontSize: 42, color: timerSeconds === 0 ? T.brick : T.ink }}>
                    {formatTimer(timerSeconds)}
                  </div>
                  <div className="flex gap-2">
                    {timerSeconds > 0 && (
                      <button
                        onClick={() => { unlockAudio(); setTimerRunning((r) => !r); }}
                        className="flex items-center gap-1.5"
                        style={{ ...monoFont, fontSize: 11.5, color: T.inkSoft, border: `1px solid ${T.line}`, borderRadius: 999, padding: "7px 14px", background: "#fff" }}
                      >
                        {timerRunning ? <Pause size={12} /> : <Play size={12} />} {timerRunning ? "Pause" : "Resume"}
                      </button>
                    )}
                    <button
                      onClick={resetTimer}
                      className="flex items-center gap-1.5"
                      style={{ ...monoFont, fontSize: 11.5, color: T.inkSoft, border: `1px solid ${T.line}`, borderRadius: 999, padding: "7px 14px", background: "#fff" }}
                    >
                      <RotateCcw size={12} /> Reset
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
        <button onClick={goNext} disabled={isLast} className="flex items-center justify-center flex-shrink-0" style={{ width: "15%", opacity: isLast ? 0.25 : 1, color: T.inkSoft }}>
          <ChevronRight size={26} />
        </button>
        </div>

        <div className="cook-sidebar flex-col" style={{ width: 300, flexShrink: 0, borderLeft: `1px solid ${T.lineSoft}`, background: T.card, overflowY: "auto", padding: "22px 20px" }}>
          <div style={{ ...monoFont, fontSize: 11, color: T.inkSoft, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 16 }}>Ingredients</div>
          <ul style={{ ...bodyFont, fontSize: 14.5, color: T.ink }} className="space-y-2.5">
            {(recipe.ingredients || []).map((ing, i) => {
              const heading = ing.match(/^#{1,6}\s*(.+)/);
              if (heading) {
                return (
                  <li key={i} style={{ listStyle: "none", ...displayFont, fontWeight: 700, fontSize: 11.5, color: T.pine, textTransform: "uppercase", letterSpacing: "0.05em", marginTop: i === 0 ? 0 : 16, marginBottom: 2 }}>
                    {heading[1]}
                  </li>
                );
              }
              const checked = checkedIngredients.has(i);
              return (
                <li key={i}>
                  <button onClick={() => toggleIngredientChecked(i)} className="flex items-start gap-2.5 text-left w-full" style={{ opacity: checked ? 0.5 : 1 }}>
                    <span
                      className="flex-shrink-0 flex items-center justify-center"
                      style={{ width: 16, height: 16, marginTop: 2, borderRadius: 4, border: `1.5px solid ${checked ? T.pine : T.line}`, background: checked ? T.pine : "#fff" }}
                    >
                      {checked && <Check size={11} color="#fff" />}
                    </span>
                    <span style={{ textDecoration: checked ? "line-through" : "none" }}>{ing}</span>
                  </button>
                </li>
              );
            })}
          </ul>
        </div>
      </div>

      <div className="flex items-center justify-between px-5 pb-6 pt-2 gap-3 flex-shrink-0">
        <GhostButton
          onClick={goPrev}
          style={{ flex: 1, justifyContent: "center", opacity: stepIdx === 0 ? 0.4 : 1 }}
        >
          <ChevronLeft size={14} /> Back
        </GhostButton>
        {isLast ? (
          <PrimaryButton onClick={onClose} style={{ flex: 1, justifyContent: "center" }}>
            <Check size={16} /> Done cooking
          </PrimaryButton>
        ) : (
          <PrimaryButton onClick={goNext} style={{ flex: 1, justifyContent: "center" }}>
            Next <ChevronRight size={16} />
          </PrimaryButton>
        )}
      </div>

      {showIngredients && (
        <div
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-6"
          style={{ background: "rgba(20,16,10,0.55)" }}
          onClick={() => setShowIngredients(false)}
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className="w-full sm:max-w-md max-h-[80vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl p-5"
            style={{ background: T.card }}
          >
            <div className="flex items-center justify-between mb-4">
              <div style={{ ...displayFont, fontWeight: 700, fontSize: 18, color: T.ink }}>Ingredients</div>
              <IconButton onClick={() => setShowIngredients(false)} title="Close"><X size={16} /></IconButton>
            </div>
            <ul style={{ ...bodyFont, fontSize: 15, color: T.ink }} className="space-y-2">
              {(recipe.ingredients || []).map((ing, i) => {
                const heading = ing.match(/^#{1,6}\s*(.+)/);
                if (heading) {
                  return (
                    <li key={i} style={{ listStyle: "none", ...displayFont, fontWeight: 700, fontSize: 12, color: T.pine, textTransform: "uppercase", letterSpacing: "0.05em", marginTop: i === 0 ? 0 : 10 }}>
                      {heading[1]}
                    </li>
                  );
                }
                return (
                  <li key={i} className="flex gap-2.5">
                    <span style={{ color: T.gold, marginTop: 3 }}>●</span><span>{ing}</span>
                  </li>
                );
              })}
            </ul>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  Modal shell                                                            */
/* ---------------------------------------------------------------------- */
function ModalShell({ title, onClose, children, wide }) {
  return (
    <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center p-0 sm:p-6 no-print" style={{ background: "rgba(20,16,10,0.55)" }}>
      <div className={`w-full ${wide ? "sm:max-w-2xl" : "sm:max-w-md"} max-h-[92vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl`} style={{ background: T.card }}>
        <div className="sticky top-0 flex items-center justify-between px-5 py-4 z-10" style={{ background: T.card, borderBottom: `1px dashed ${T.line}` }}>
          <div style={{ ...displayFont, fontWeight: 700, fontSize: 19, color: T.ink }}>{title}</div>
          <IconButton onClick={onClose} title="Close"><X size={17} /></IconButton>
        </div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );
}

function Field({ label, children, hint }) {
  return (
    <div className="mb-4">
      <div style={{ ...monoFont, fontSize: 11, color: T.inkSoft, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 6 }}>{label}</div>
      {children}
      {hint && <div style={{ ...bodyFont, fontSize: 11.5, color: T.inkFaint, marginTop: 4 }}>{hint}</div>}
    </div>
  );
}

const inputStyle = {
  ...bodyFont,
  width: "100%",
  padding: "9px 12px",
  borderRadius: 10,
  border: `1px solid ${T.line}`,
  background: "#fff",
  fontSize: 14.5,
  color: T.ink,
  outline: "none",
};

/* ---------------------------------------------------------------------- */
/*  Member form modal                                                      */
/* ---------------------------------------------------------------------- */
function MemberFormModal({ initial, onClose, onSave }) {
  const [name, setName] = useState(initial?.name || "");
  const [nickname, setNickname] = useState(initial?.nickname || "");
  const [relationship, setRelationship] = useState(initial?.relationship || "");
  const [description, setDescription] = useState(initial?.description || "");
  const [photo, setPhoto] = useState(initial?.photo || "");
  const [busy, setBusy] = useState(false);

  const handlePhoto = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setBusy(true);
    try { setPhoto(await compressImageFile(file, 700, 0.8)); } catch (err) { console.error(err); }
    setBusy(false);
  };

  const canSave = name.trim().length > 0;

  return (
    <ModalShell title={initial ? "Edit family member" : "Add family member"} onClose={onClose}>
      <div className="flex flex-col items-center mb-4">
        <div className="w-24 h-24 rounded-full overflow-hidden mb-2 flex items-center justify-center" style={{ background: T.paperTexture, border: `2px solid ${T.line}` }}>
          {photo ? <img src={photo} alt="" className="w-full h-full object-cover" /> : <Camera size={22} color={T.inkFaint} />}
        </div>
        <label style={{ ...monoFont, fontSize: 12, color: T.pine, cursor: "pointer" }}>
          {busy ? "Processing…" : photo ? "Change photo" : "Upload photo"}
          <input type="file" accept="image/*" className="hidden" onChange={handlePhoto} />
        </label>
      </div>

      <Field label="Name *">
        <input style={inputStyle} value={name} onChange={(e) => setName(e.target.value)} placeholder="Mary" />
      </Field>
      <Field label="Nickname (optional)">
        <input style={inputStyle} value={nickname} onChange={(e) => setNickname(e.target.value)} placeholder="" />
      </Field>
      <Field label="Relationship (optional)">
        <input style={inputStyle} value={relationship} onChange={(e) => setRelationship(e.target.value)} placeholder="Grandma, Mom, Aunt, Grandpa…" />
      </Field>
      <Field label="Short description or memories (optional)">
        <textarea style={{ ...inputStyle, minHeight: 80 }} value={description} onChange={(e) => setDescription(e.target.value)} placeholder="Always made the best pumpkin pie…" />
      </Field>

      <PrimaryButton
        style={{ width: "100%", justifyContent: "center", opacity: canSave ? 1 : 0.5 }}
        onClick={() => {
          if (!canSave) return;
          onSave({
            id: initial?.id || makeId("member"),
            name: name.trim(),
            nickname: nickname.trim(),
            relationship: relationship.trim(),
            description: description.trim(),
            photo,
            dateAdded: initial?.dateAdded || new Date().toISOString(),
          });
        }}
      >
        <Check size={16} /> {initial ? "Save changes" : "Add family member"}
      </PrimaryButton>
    </ModalShell>
  );
}

/* ---------------------------------------------------------------------- */
/*  Recipe form modal                                                      */
/* ---------------------------------------------------------------------- */
function RecipeFormModal({ initial, members, defaultMemberId, categories, recipes, onClose, onSave, source = "family", brands = [], defaultBrand = "" }) {
  const [name, setName] = useState(initial?.name || "");
  const [memberId, setMemberId] = useState(initial?.memberId || defaultMemberId || "");
  const [brand, setBrand] = useState(initial?.brand || defaultBrand || "");
  const [category, setCategory] = useState(initial?.category || "");
  const [ingredients, setIngredients] = useState((initial?.ingredients || []).join("\n"));
  const [directions, setDirections] = useState((initial?.directions || []).join("\n"));
  const [tags, setTags] = useState((initial?.tags || []).join(", "));
  const [notes, setNotes] = useState(initial?.notes || "");
  const [photo, setPhoto] = useState(initial?.photo || "");
  const [originalPhotos, setOriginalPhotos] = useState(initial?.originalPhotos || []);
  const [relatedIds, setRelatedIds] = useState(initial?.relatedIds || []);
  const [relatedQuery, setRelatedQuery] = useState("");
  const [busy, setBusy] = useState(false);

  const isBrand = (initial ? initial.source : source) === "brand";

  const relatableRecipes = (recipes || []).filter((r) => r.id !== initial?.id);
  const relatedRecipes = relatedIds.map((id) => relatableRecipes.find((r) => r.id === id)).filter(Boolean);
  const relatedOptions = relatableRecipes.filter((r) => !relatedIds.includes(r.id) && r.name.toLowerCase().includes(relatedQuery.trim().toLowerCase()));
  const toggleRelated = (id) => setRelatedIds((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);

  const handlePhoto = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setBusy(true);
    try { setPhoto(await compressImageFile(file, 1100, 0.75)); } catch (err) { console.error(err); }
    setBusy(false);
  };

  const handleOriginalPhotos = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    setBusy(true);
    try {
      const compressed = await Promise.all(files.map((f) => compressImageFile(f, 1400, 0.8)));
      setOriginalPhotos((prev) => [...prev, ...compressed]);
    } catch (err) { console.error(err); }
    setBusy(false);
    e.target.value = "";
  };

  const moveOriginal = (i, dir) => {
    setOriginalPhotos((prev) => {
      const arr = [...prev];
      const j = i + dir;
      if (j < 0 || j >= arr.length) return arr;
      [arr[i], arr[j]] = [arr[j], arr[i]];
      return arr;
    });
  };
  const removeOriginal = (i) => setOriginalPhotos((prev) => prev.filter((_, idx) => idx !== i));

  const canSave = name.trim().length > 0 && (isBrand ? brand.trim().length > 0 : !!memberId);

  return (
    <ModalShell title={initial ? "Edit recipe" : (isBrand ? "Add brand recipe" : "Add recipe")} onClose={onClose} wide>
      <Field label="Recipe name *">
        <input style={inputStyle} value={name} onChange={(e) => setName(e.target.value)} placeholder="Chocolate Chip Cookies" />
      </Field>

      {isBrand ? (
        <Field label="Brand / source *" hint="Where did this recipe come from? e.g. Coborn's, Nestlé, a cereal box, a recipe card from the store.">
          <input style={inputStyle} list="brand-options" value={brand} onChange={(e) => setBrand(e.target.value)} placeholder="Coborn's, Nestlé, Pillsbury…" />
          <datalist id="brand-options">
            {brands.map((b) => <option key={b} value={b} />)}
          </datalist>
        </Field>
      ) : (
        <Field label="Family member *" hint={members.length === 0 ? "Add a family member first so you can assign this recipe." : undefined}>
          <select style={inputStyle} value={memberId} onChange={(e) => setMemberId(e.target.value)}>
            <option value="">Select who this recipe belongs to…</option>
            {members.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
          </select>
        </Field>
      )}

      <Field label="Category">
        <input style={inputStyle} list="category-options" value={category} onChange={(e) => setCategory(e.target.value)} placeholder="Cookies, Dinner, Holiday…" />
        <datalist id="category-options">
          {Array.from(new Set([...CATEGORY_PRESETS, ...categories])).map((c) => <option key={c} value={c} />)}
        </datalist>
      </Field>

      <Field label="Ingredients" hint="One ingredient per line.">
        <textarea style={{ ...inputStyle, minHeight: 110 }} value={ingredients} onChange={(e) => setIngredients(e.target.value)} placeholder={"2 cups flour\n1 cup butter, softened\n3/4 cup brown sugar"} />
      </Field>

      <Field label="Directions" hint="One step per line.">
        <textarea style={{ ...inputStyle, minHeight: 110 }} value={directions} onChange={(e) => setDirections(e.target.value)} placeholder={"Preheat oven to 375°F.\nCream butter and sugar together.\nBake for 10-12 minutes."} />
      </Field>

      <Field label="Tags" hint="Comma-separated, e.g. cookies, christmas, chocolate">
        <input style={inputStyle} value={tags} onChange={(e) => setTags(e.target.value)} placeholder="cookies, christmas, chocolate" />
      </Field>

      <Field label={isBrand ? "Notes (optional)" : "Notes / family memory or story (optional)"}>
        <textarea style={{ ...inputStyle, minHeight: 80 }} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder={isBrand ? "Where you found it, what you changed, how it turned out…" : "Grandma always doubled this recipe for the holidays…"} />
      </Field>

      <Field label="Related recipes (optional)" hint="Link a frosting, sauce, or side that pairs with this one — the link shows on both recipes.">
        {relatedRecipes.length > 0 && (
          <div className="flex flex-wrap gap-1.5 mb-2">
            {relatedRecipes.map((r) => (
              <span key={r.id} className="flex items-center gap-1.5 px-2.5 py-1 rounded-full" style={{ background: "rgba(47,75,60,0.08)", ...monoFont, fontSize: 11.5, color: T.pine }}>
                {r.name}
                <button onClick={() => toggleRelated(r.id)} title="Remove link"><X size={11} /></button>
              </span>
            ))}
          </div>
        )}
        {relatableRecipes.length === 0 ? (
          <div style={{ ...monoFont, fontSize: 12, color: T.inkFaint }}>Add another recipe first to link one here.</div>
        ) : (
          <>
            <input style={inputStyle} value={relatedQuery} onChange={(e) => setRelatedQuery(e.target.value)} placeholder="Search recipes to link…" />
            {relatedQuery.trim() && (
              <div className="rounded-lg mt-1.5 overflow-hidden" style={{ border: `1px solid ${T.line}`, maxHeight: 160, overflowY: "auto" }}>
                {relatedOptions.length === 0 ? (
                  <div style={{ ...monoFont, fontSize: 12, color: T.inkFaint, padding: "8px 10px" }}>No matching recipes.</div>
                ) : relatedOptions.map((r) => (
                  <button key={r.id} onClick={() => { toggleRelated(r.id); setRelatedQuery(""); }} className="w-full text-left" style={{ ...bodyFont, fontSize: 13.5, color: T.ink, padding: "8px 10px", borderBottom: `1px solid ${T.lineSoft}`, background: "#fff" }}>
                    {r.name}
                  </button>
                ))}
              </div>
            )}
          </>
        )}
      </Field>

      <Field label="Recipe photo">
        <div className="flex items-center gap-3">
          <div className="w-20 h-20 rounded-lg overflow-hidden flex items-center justify-center flex-shrink-0" style={{ background: T.paperTexture, border: `1px solid ${T.line}` }}>
            {photo ? <img src={photo} alt="" className="w-full h-full object-cover" /> : <Camera size={18} color={T.inkFaint} />}
          </div>
          <label style={{ ...monoFont, fontSize: 12, color: T.pine, cursor: "pointer" }}>
            {photo ? "Change photo" : "Upload photo"}
            <input type="file" accept="image/*" className="hidden" onChange={handlePhoto} />
          </label>
        </div>
      </Field>

      <Field label={isBrand ? "Original packaging / card photo" : "Original recipe card (the handwritten or printed card)"} hint="Upload or take multiple photos — these are kept separate from the typed recipe above so the original is preserved.">
        <label className="flex items-center justify-center gap-2 py-3 rounded-lg border-2 border-dashed cursor-pointer" style={{ borderColor: T.line, color: T.pine, ...monoFont, fontSize: 12.5 }}>
          <Upload size={15} /> {busy ? "Processing…" : "Add original card photo(s)"}
          <input type="file" accept="image/*" capture="environment" multiple className="hidden" onChange={handleOriginalPhotos} />
        </label>

        {originalPhotos.length > 0 && (
          <div className="grid grid-cols-3 gap-2 mt-3">
            {originalPhotos.map((p, i) => (
              <div key={i} className="relative rounded-lg overflow-hidden" style={{ border: `1px solid ${T.line}` }}>
                <img src={p} alt="" className="w-full h-24 object-cover" />
                <div className="absolute inset-x-0 bottom-0 flex items-center justify-between px-1 py-1" style={{ background: "rgba(20,16,10,0.55)" }}>
                  <button onClick={() => moveOriginal(i, -1)} className="text-white/90"><ChevronLeft size={14} /></button>
                  <button onClick={() => removeOriginal(i)} className="text-white/90"><Trash2 size={13} /></button>
                  <button onClick={() => moveOriginal(i, 1)} className="text-white/90"><ChevronRight size={14} /></button>
                </div>
              </div>
            ))}
          </div>
        )}
      </Field>

      <PrimaryButton
        style={{ width: "100%", justifyContent: "center", opacity: canSave ? 1 : 0.5, marginTop: 4 }}
        onClick={() => {
          if (!canSave) return;
          onSave({
            id: initial?.id || makeId("recipe"),
            source: isBrand ? "brand" : "family",
            name: name.trim(),
            memberId: isBrand ? "" : memberId,
            brand: isBrand ? brand.trim() : "",
            category: category.trim(),
            ingredients: ingredients.split("\n").map((s) => formatFractions(s.trim())).filter(Boolean),
            directions: directions.split("\n").map((s) => formatFractions(s.trim())).filter(Boolean),
            tags: tags.split(",").map((s) => s.trim()).filter(Boolean),
            notes: formatFractions(notes.trim()),
            photo,
            originalPhotos,
            relatedIds,
            favorite: initial?.favorite || false,
            dateAdded: initial?.dateAdded || new Date().toISOString(),
          });
        }}
      >
        <Check size={16} /> {initial ? "Save changes" : (isBrand ? "Add brand recipe" : "Add recipe")}
      </PrimaryButton>
    </ModalShell>
  );
}

function RecipeDetail({ recipe, member, allRecipes, onBack, onEdit, onDelete, onToggleFavorite, onOpenArchive, onOpenMember, onOpenRecipe, onCookMode, onAddToShoppingList }) {
  const relatedRecipes = (recipe.relatedIds || []).map((id) => (allRecipes || []).find((r) => r.id === id)).filter(Boolean);
  const [toast, setToast] = useState("");
  const isBrand = recipe.source === "brand";

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(""), 2200);
  };

  const handlePrint = triggerPrint;

  const handleShare = async () => {
    const text = recipeToText(recipe, member);
    if (navigator.share) {
      try {
        await navigator.share({ title: recipe.name, text });
        return;
      } catch (e) {
        // user cancelled the native share sheet, or it failed — fall back to copy
        if (e && e.name === "AbortError") return;
      }
    }
    const ok = await copyTextToClipboard(text);
    showToast(ok ? "Recipe copied to clipboard" : "Couldn't copy — try selecting the text manually");
  };

  return (
    <div className="max-w-2xl mx-auto px-4 pb-24">
      <div className="flex items-center justify-between pt-5 pb-4 no-print">
        <IconButton onClick={onBack} title="Back"><ArrowLeft size={17} /></IconButton>
        <div className="flex gap-2">
          <IconButton onClick={() => onToggleFavorite(recipe.id)} title="Favorite">
            <Heart size={16} fill={recipe.favorite ? T.brick : "none"} color={recipe.favorite ? T.brick : T.inkSoft} />
          </IconButton>
          <IconButton onClick={handleShare} title="Share"><Share2 size={15} /></IconButton>
          <IconButton onClick={handlePrint} title="Print"><Printer size={15} /></IconButton>
          <IconButton onClick={() => onEdit(recipe)} title="Edit"><Pencil size={15} /></IconButton>
          <IconButton onClick={() => onDelete(recipe.id)} title="Delete" danger><Trash2 size={15} /></IconButton>
        </div>
      </div>

      {toast && (
        <div
          className="no-print"
          style={{ position: "fixed", left: "50%", bottom: 24, transform: "translateX(-50%)", background: T.ink, color: "#F3ECD8", ...monoFont, fontSize: 12.5, padding: "10px 16px", borderRadius: 999, boxShadow: "0 6px 18px rgba(0,0,0,0.25)", zIndex: 60, whiteSpace: "nowrap" }}
        >
          {toast}
        </div>
      )}

      <div className="rounded-2xl overflow-hidden mb-5 print-card" style={{ background: T.card, border: `1px solid ${T.lineSoft}`, boxShadow: "0 4px 16px rgba(43,36,24,0.1)" }}>

          )}
        </div>
        <div className="p-5">

          {isBrand ? (

/* ---------------------------------------------------------------------- */
/*  Auth gate — simple email/password login, shared by the whole family    */
/* ---------------------------------------------------------------------- */
function AuthGate({ children }) {
  const [session, setSession] = useState(undefined); // undefined = loading, null = signed out
  const [mode, setMode] = useState("signin"); // "signin" | "signup"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [showPassword, setShowPassword] = useState(false);
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = supabaseClient.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    setInfo("");
    setBusy(true);
    try {
      if (mode === "signin") {
        const { error: err } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (err) throw err;
      } else {
        const { error: err } = await supabaseClient.auth.signUp({ email, password });
        if (err) throw err;
        setInfo("Account created! If email confirmation is on, check your inbox — otherwise you're signed in.");
      }
    } catch (err) {
      setError(err.message || "Something went wrong.");
    } finally {
      setBusy(false);
    }
  };

  if (session === undefined) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ background: T.paperTexture, backgroundImage: `repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(180,160,110,0.18) 28px)` }}>
        <div className="w-9 h-9 rounded-full flex items-center justify-center animate-pulse" style={{ background: T.pine }}>
          <BookOpen size={16} color="#fff" />
        </div>
      </div>
    );
  }

  if (!session) {
    return (
      <div className="min-h-screen flex items-center justify-center px-4 py-10" style={{ background: T.paperTexture, backgroundImage: `repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(180,160,110,0.18) 28px)` }}>
        <form
          onSubmit={submit}
          className="w-full max-w-md rounded-2xl overflow-hidden"
          style={{ background: T.card, border: `1px solid ${T.line}`, boxShadow: "0 12px 32px rgba(43,36,24,0.18)" }}
        >
          <div className="flex flex-col items-center text-center pt-9 pb-6 px-9" style={{ borderBottom: `1px dashed ${T.line}` }}>
            <div className="w-12 h-12 rounded-full flex items-center justify-center mb-3" style={{ background: T.pine }}>
              <BookOpen size={22} color="#fff" />
            </div>
            <div style={{ ...displayFont, fontWeight: 700, fontSize: 23, color: T.ink, lineHeight: 1.2 }}>The Family Recipe Box</div>
            <div style={{ ...bodyFont, fontSize: 13.5, color: T.inkSoft, marginTop: 6 }}>
              {mode === "signin" ? "Sign in to see the family recipes." : "Create an account to join the family recipe box."}
            </div>
          </div>

          <div className="px-9 pt-6 pb-7">
            <div className="flex flex-col gap-4">
              <Field label="Email">
                <input
                  type="email"
                  required
                  placeholder="you@example.com"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  style={inputStyle}
                  autoComplete="email"
                  autoFocus
                />
              </Field>
              <Field label="Password">
                <div className="relative">
                  <input
                    type={showPassword ? "text" : "password"}
                    required
                    placeholder={mode === "signin" ? "Your password" : "At least 6 characters"}
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    style={{ ...inputStyle, paddingRight: 40 }}
                    autoComplete={mode === "signin" ? "current-password" : "new-password"}
                    minLength={6}
                  />
                  <button
                    type="button"
                    onClick={() => setShowPassword((v) => !v)}
                    tabIndex={-1}
                    style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", ...monoFont, fontSize: 10.5, color: T.inkSoft, textTransform: "uppercase", letterSpacing: "0.04em" }}
                  >
                    {showPassword ? "Hide" : "Show"}
                  </button>
                </div>
              </Field>
            </div>

            {error && (
              <div className="flex items-start gap-2 mt-4 p-3 rounded-xl" style={{ background: "rgba(147,64,44,0.08)", border: `1px solid rgba(147,64,44,0.25)` }}>
                <Info size={14} color={T.brick} style={{ marginTop: 1, flexShrink: 0 }} />
                <div style={{ ...bodyFont, fontSize: 13, color: T.brick, lineHeight: 1.4 }}>{error}</div>
              </div>
            )}
            {info && (
              <div className="flex items-start gap-2 mt-4 p-3 rounded-xl" style={{ background: "rgba(47,75,60,0.08)", border: `1px solid rgba(47,75,60,0.2)` }}>
                <Check size={14} color={T.pine} style={{ marginTop: 1, flexShrink: 0 }} />
                <div style={{ ...bodyFont, fontSize: 13, color: T.pine, lineHeight: 1.4 }}>{info}</div>
              </div>
            )}

            <button
              type="submit"
              disabled={busy}
              className="w-full mt-6 py-3 rounded-xl transition-opacity"
              style={{ background: T.pine, color: "#fff", ...monoFont, fontSize: 13, letterSpacing: "0.03em", opacity: busy ? 0.7 : 1 }}
            >
              {busy ? "Please wait…" : mode === "signin" ? "Sign In" : "Create Account"}
            </button>
            <button
              type="button"
              onClick={() => { setMode(mode === "signin" ? "signup" : "signin"); setError(""); setInfo(""); }}
              className="w-full mt-4 py-1"
              style={{ ...monoFont, fontSize: 12, color: T.inkSoft }}
            >
              {mode === "signin" ? (
                <>New to the family? <span style={{ color: T.pine, textDecoration: "underline" }}>Create an account</span></>
              ) : (
                <>Already have an account? <span style={{ color: T.pine, textDecoration: "underline" }}>Sign in</span></>
              )}
            </button>
          </div>
        </form>
      </div>
    );
  }

  return children(session);
}

/* ---------------------------------------------------------------------- */
/*  Cookbook export — a printable view of every recipe, grouped by family  */
/*  member and sorted by category within each member's section. Uses the  */
/*  same print stylesheet as the single-recipe print/PDF flow.             */
/* ---------------------------------------------------------------------- */
function CookbookExport({ recipes, members, onBack }) {
  const memberById = (id) => members.find((m) => m.id === id);

  const groups = [];
  const sortedMembers = [...members].sort((a, b) => a.name.localeCompare(b.name));
  for (const member of sortedMembers) {
    const memberRecipes = recipes.filter((r) => r.memberId === member.id);
    if (memberRecipes.length > 0) groups.push({ member, recipes: memberRecipes });
  }
  const unassigned = recipes.filter((r) => !memberById(r.memberId));
  if (unassigned.length > 0) groups.push({ member: null, recipes: unassigned });

  const byCategoryThenName = (list) => {
    const sorted = [...list].sort((a, b) => {
      const catA = a.category || "Uncategorized";
      const catB = b.category || "Uncategorized";
      if (catA !== catB) return catA.localeCompare(catB);
      return a.name.localeCompare(b.name);
    });
    const sections = [];
    for (const r of sorted) {
      const cat = r.category || "Uncategorized";
      const last = sections[sections.length - 1];
      if (last && last.category === cat) last.recipes.push(r);
      else sections.push({ category: cat, recipes: [r] });
    }
    return sections;
  };

  return (
    <div className="max-w-2xl mx-auto px-4 pb-24">
      <div className="flex items-center justify-between pt-5 pb-4 no-print">
        <IconButton onClick={onBack} title="Back"><ArrowLeft size={17} /></IconButton>
        <IconButton onClick={triggerPrint} title="Print / Save as PDF"><Printer size={15} /></IconButton>
      </div>

      <div className="text-center mb-10" style={{ paddingTop: 20 }}>
        <Eyebrow style={{ justifyContent: "center", display: "flex" }}>A collection of family recipes</Eyebrow>
        <div style={{ ...displayFont, fontWeight: 700, fontSize: 34, color: T.ink, marginTop: 6 }}>The Family Recipe Box</div>
        <div style={{ ...monoFont, fontSize: 12, color: T.inkSoft, marginTop: 8 }}>{recipes.length} recipe{recipes.length === 1 ? "" : "s"} · printed {formatDate(new Date().toISOString())}</div>
      </div>

      {groups.length > 0 && (
        <div className="cookbook-toc mb-10">
          <Eyebrow style={{ marginBottom: 14 }}>Table of Contents</Eyebrow>
          <div className="flex flex-col gap-5">
            {groups.map(({ member, recipes: memberRecipes }) => (
              <div key={member?.id || "unassigned"}>
                <div style={{ ...displayFont, fontWeight: 700, fontSize: 15, color: T.ink, marginBottom: 4 }}>
                  {member ? `${member.name}'s Recipe Box` : "Family Recipes"}
                </div>
                <div className="flex flex-col gap-1">
                  {byCategoryThenName(memberRecipes).map((section) => (
                    <div key={section.category} className="flex items-baseline gap-2" style={{ ...bodyFont, fontSize: 13, color: T.inkSoft }}>
                      <span style={{ ...monoFont, fontSize: 10.5, color: T.pine, textTransform: "uppercase", letterSpacing: "0.05em", minWidth: 90 }}>{section.category}</span>
                      <span>{section.recipes.map((r) => r.name).join(", ")}</span>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {groups.length === 0 && (
        <div style={{ ...bodyFont, fontSize: 14, color: T.inkSoft }} className="text-center">No recipes yet.</div>
      )}

      {groups.map(({ member, recipes: memberRecipes }, gi) => (
        <div key={member?.id || "unassigned"} className="cookbook-member-section mb-10">
          <div className="flex items-center gap-3 mb-6" style={{ borderBottom: `2px solid ${T.pine}`, paddingBottom: 10 }}>
            <div className="w-9 h-9 rounded-full overflow-hidden flex-shrink-0 flex items-center justify-center" style={{ background: T.paperTexture }}>
              {member?.photo ? <img src={member.photo} alt="" className="w-full h-full object-cover recipe-photo" /> : <Users size={15} color={T.inkFaint} />}
            </div>
            <div style={{ ...displayFont, fontWeight: 700, fontSize: 22, color: T.ink }}>{member ? `${member.name}'s Recipe Box` : "Family Recipes"}</div>
          </div>

          {byCategoryThenName(memberRecipes).map((section) => (
            <div key={section.category} className="mb-6">
              <div className="cookbook-category-heading" style={{ ...displayFont, fontWeight: 700, fontSize: 12, color: T.pine, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 10 }}>
                {section.category}
              </div>
              {section.recipes.map((recipe) => (
                <div key={recipe.id} className="cookbook-recipe mb-5 pb-4" style={{ borderBottom: `1px dashed ${T.lineSoft}` }}>
                  <div className="cookbook-recipe-title" style={{ ...displayFont, fontWeight: 700, fontSize: 16, color: T.ink, marginBottom: 1 }}>{recipe.name}</div>
                  {recipe.tags?.length > 0 && (
                    <div style={{ ...monoFont, fontSize: 9.5, color: T.inkSoft, marginBottom: 6 }}>{recipe.tags.map((t) => `#${t}`).join("  ")}</div>
                  )}
                  <div className="flex flex-col gap-2">
                    {recipe.ingredients?.length > 0 && (
                      <div>
                        <Eyebrow style={{ marginBottom: 4 }}>Ingredients</Eyebrow>
                        <ul style={{ ...bodyFont, fontSize: 11.5, color: T.ink, lineHeight: 1.35 }} className="space-y-0.5">
                          {recipe.ingredients.map((ing, i) => (
                            <li key={i} className="flex gap-1.5">
                              <span style={{ color: T.gold }}>•</span><span>{ing}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    )}
                    {recipe.directions?.length > 0 && (
                      <div>
                        <Eyebrow style={{ marginBottom: 4 }}>Directions</Eyebrow>
                        <ol style={{ ...bodyFont, fontSize: 11.5, color: T.ink, lineHeight: 1.35 }} className="space-y-0.5">
                          {recipe.directions.map((step, i) => (
                            <li key={i} className="flex gap-1.5">
                              <span style={{ ...displayFont, fontWeight: 700, color: T.pine, minWidth: 14 }}>{i + 1}.</span><span>{step}</span>
                            </li>
                          ))}
                        </ol>
                      </div>
                    )}
                  </div>
                  {recipe.notes && (
                    <div style={{ ...bodyFont, fontStyle: "italic", fontSize: 10.5, color: T.inkSoft, marginTop: 6 }}>{recipe.notes}</div>
                  )}
                </div>
              ))}
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  Surprise Me — random recipe picker, filterable by member and category  */
/* ---------------------------------------------------------------------- */
function SurpriseMeModal({ recipes, members, onClose, onPick }) {
  const [memberId, setMemberId] = useState("");
  const [category, setCategory] = useState("");
  const categories = Array.from(new Set(recipes.map((r) => r.category).filter(Boolean))).sort();

  const matching = recipes.filter((r) => {
    if (memberId && r.memberId !== memberId) return false;
    if (category && r.category !== category) return false;
    return true;
  });

  const pick = () => {
    if (matching.length === 0) return;
    const chosen = matching[Math.floor(Math.random() * matching.length)];
    onPick(chosen.id);
  };

  return (
    <ModalShell title="Surprise Me" onClose={onClose}>
      <Field label="Family member">
        <select style={inputStyle} value={memberId} onChange={(e) => setMemberId(e.target.value)}>
          <option value="">All family members</option>
          {members.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
        </select>
      </Field>
      <Field label="Category">
        <select style={inputStyle} value={category} onChange={(e) => setCategory(e.target.value)}>
          <option value="">Any category</option>
          {categories.map((c) => <option key={c} value={c}>{c}</option>)}
        </select>
      </Field>
      <div style={{ ...monoFont, fontSize: 12, color: T.inkSoft, marginBottom: 14 }}>
        {matching.length === 0 ? "No recipes match that combination." : `${matching.length} recipe${matching.length === 1 ? "" : "s"} to choose from.`}
      </div>
      <button
        onClick={pick}
        disabled={matching.length === 0}
        className="w-full py-2.5 rounded-xl flex items-center justify-center gap-2"
        style={{ background: matching.length === 0 ? T.line : T.pine, color: "#fff", ...monoFont, fontSize: 13 }}
      >
        <Dice size={15} /> Pick a recipe
      </button>
    </ModalShell>
  );
}
